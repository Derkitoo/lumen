    <script type="text/babel">
        // --- EXTRACTION DES OUTILS ---
        const { useState, useEffect, createElement } = React;
        
        // Configuration Lucide
        // On récupère toutes les icônes de window.lucide
        const LucideIcons = window.lucide;
        
        // Composant Wrapper pour utiliser Lucide avec React
        const IconWrapper = ({ name, size = 24, className = '', ...props }) => {
            const IconData = LucideIcons[name];
            if (!IconData) return null;
            
            // Fonction utilitaire pour convertir les attributs SVG pour React (camelCase)
            const camelCase = (str) => str.replace(/-([a-z])/g, (g) => g[1].toUpperCase());
            
            const renderNode = (node, i) => {
               if (typeof node === 'string') return node;
               
               // CORRECTION : Les données de Lucide Vanilla sont sous forme de tableau [tag, attrs, children]
               const tag = node[0];
               const attrs = node[1] || {};
               const children = node[2] || [];
               
               const reactAttrs = { key: i };
               
               for (const key in attrs) {
                   // Quelques attributs classiques qui doivent rester en string
                   if (key === 'class') {
                       reactAttrs.className = attrs[key];
                   } else if (key === 'xmlns' || key === 'viewBox') {
                       reactAttrs[key] = attrs[key];
                   } else {
                       reactAttrs[camelCase(key)] = attrs[key];
                   }
               }
               
               return createElement(
                   tag, 
                   reactAttrs, 
                   children.map((child, index) => renderNode(child, index))
               );
            };

            const defaultAttrs = {
               xmlns: "http://www.w3.org/2000/svg",
               width: size,
               height: size,
               viewBox: "0 0 24 24",
               fill: "none",
               stroke: "currentColor",
               strokeWidth: "2",
               strokeLinecap: "round",
               strokeLinejoin: "round",
               className: className,
               ...props
            };

            return createElement(
                'svg', 
                defaultAttrs, 
                IconData.map((node, i) => renderNode(node, i))
            );
        };
        
        // Création des composants d'icônes à partir du Wrapper
        const Heart = (props) => <IconWrapper name="Heart" {...props} />;
        const Activity = (props) => <IconWrapper name="Activity" {...props} />;
        const Clock = (props) => <IconWrapper name="Clock" {...props} />;
        const ShieldAlert = (props) => <IconWrapper name="ShieldAlert" {...props} />;
        const ArrowLeft = (props) => <IconWrapper name="ArrowLeft" {...props} />;
        const Check = (props) => <IconWrapper name="Check" {...props} />;
        const Wind = (props) => <IconWrapper name="Wind" {...props} />;
        const X = (props) => <IconWrapper name="X" {...props} />;
        const MessageCircle = (props) => <IconWrapper name="MessageCircle" {...props} />;
        const HeartCrack = (props) => <IconWrapper name="HeartCrack" {...props} />;
        const Home = (props) => <IconWrapper name="Home" {...props} />;
        const BookOpen = (props) => <IconWrapper name="BookOpen" {...props} />;

        // Hook pour la persistance des données
        function useLocalStorage(key, initialValue) {
          const [storedValue, setStoredValue] = useState(() => {
            try {
              const item = window.localStorage.getItem(key);
              return item ? JSON.parse(item) : initialValue;
            } catch (error) {
              return initialValue;
            }
          });

          const setValue = (value) => {
            try {
              const valueToStore = value instanceof Function ? value(storedValue) : value;
              setStoredValue(valueToStore);
              window.localStorage.setItem(key, JSON.stringify(valueToStore));
            } catch (error) {}
          };
          return [storedValue, setValue];
        }

        // --- DATA & SCENARIOS ---

        // --- UI COMPONENTS ---

              {Icon && <Icon size={20} />}
              {children}

          );
        };

        const Card = ({ children, className = '', onClick }) => (
          <div onClick={onClick} className={`bg-slate-800/40 border border-slate-700/50 rounded-2xl p-6 backdrop-blur-md shadow-xl ${onClick ? 'cursor-pointer hover:bg-slate-800/60 transition-colors' : ''} ${className}`}>

                  <div className="text-slate-300 leading-relaxed bg-slate-800/40 p-6 rounded-3xl border border-slate-700/50 text-sm">
                    {selectedArticle.content}
                  </div>
                </div>
              )}
            </div>
          );
        };

        const JournalView = ({ journal, clearJournal }) => {
          return (
            <div className="flex flex-col h-full animate-fade-in pb-24 overflow-y-auto hide-scrollbar">
              <Header title="Mon Espace" subtitle="Suivi de vos progrès" />
              {journal.length === 0 ? (
                <div className="flex-1 flex flex-col items-center justify-center text-center opacity-50 px-4">
                  <Calendar size={48} className="text-slate-600 mb-4" />
                  <p className="text-slate-400 text-sm">Votre journal est vide.</p>
                </div>
              ) : (
                <div className="flex-1 flex flex-col gap-4 mt-2">
                  <div className="flex justify-end mb-1">
                     <button onClick={clearJournal} className="text-xs text-rose-400/70 hover:text-rose-400 flex items-center gap-1"><Trash2 size={12}/> Effacer l'historique</button>
                  </div>
                  {journal.map((entry, i) => {
                    if (entry.type === 'emotion_analysis') {
                      const family = EMOTIONS_DATA[entry.analysis.familyId] || EMOTIONS_DATA.FEAR;
                      const Icon = family.icon;
                      return (
                        <Card key={i} className={`py-4 border-l-4 ${family.border}`}>
                          <div className="flex justify-between items-start mb-3">
                            <div className="flex items-center gap-2">
                              <div className={`p-1.5 rounded-lg ${family.bg} ${family.color}`}><Icon size={14} /></div>
                              <span className="font-bold text-slate-200 text-sm">Autopsie : {family.label}</span>
                            </div>
                            <span className="text-[10px] text-slate-500 font-mono">{new Date(entry.date).toLocaleDateString('fr-FR')}</span>
                          </div>
                          <div className="space-y-2 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
                            <p className="text-xs text-slate-300"><span className="text-slate-500">Ressenti exact :</span> {entry.analysis.specific}</p>
                            <p className="text-xs text-slate-300"><span className="text-slate-500">Besoin racine :</span> <span className="font-semibold text-indigo-400">{entry.analysis.need}</span></p>
                            <div className="h-px w-full bg-slate-700/50 my-1" />
                            <p className="text-xs text-slate-300 italic">Action : "{entry.analysis.action}"</p>
                          </div>
                        </Card>
                      );
                    }
                    if (entry.type === 'mood') {
                      const moodConfig = { good: { icon: Smile, color: 'text-teal-400', label: 'Serein' }, neutral: { icon: Meh, color: 'text-amber-400', label: 'Instable' }, bad: { icon: Frown, color: 'text-rose-400', label: 'Anxieux' } };
                      const cfg = moodConfig[entry.mood] || moodConfig.neutral;
                      const Icon = cfg.icon;
                      return (
                        <Card key={i} className="py-3 border border-slate-700/50 bg-slate-800/20">
                          <div className="flex justify-between items-center">
                            <div className="flex items-center gap-3"><Icon size={20} className={cfg.color} /><span className="font-medium text-slate-300 text-sm">{cfg.label}</span></div>
                            <span className="text-[10px] text-slate-500 font-mono">{new Date(entry.date).toLocaleDateString('fr-FR')}</span>
                          </div>
                        </Card>
                      );
                    }
                    return null;
                  })}
                </div>
              )}
            </div>
          );
        };

        const EmotionAnalyzerFlow = ({ onComplete, onCancel }) => {
          const [step, setStep] = useState(1);
          const [analysis, setAnalysis] = useState({ familyId: null, specific: null, somatic: null, need: null, action: '' });
          const currentFamily = analysis.familyId ? EMOTIONS_DATA[analysis.familyId] : null;
          const handleNext = (key, value) => { setAnalysis(prev => ({ ...prev, [key]: value })); setStep(prev => prev + 1); };

          return (
            <div className="flex flex-col h-full animate-fade-in bg-slate-900 relative z-10 pb-8 overflow-y-auto">
              <Header title="Le Laboratoire" subtitle={`Étape ${step}/5`} onBack={step > 1 ? () => setStep(step - 1) : onCancel} />
              
              <div className="flex gap-1 mb-6 px-1">
                {[1, 2, 3, 4, 5].map((i) => (
                  <div key={i} className={`h-1.5 rounded-full flex-1 transition-all duration-300 ${i === step ? (currentFamily ? currentFamily.bg.replace('/10', '') : 'bg-indigo-500') : i < step ? 'bg-slate-700' : 'bg-slate-800'}`} />
                ))}
              </div>

              <div className="flex-1 flex flex-col">
                {step === 1 && (
                  <>
                    <h2 className="text-xl font-bold text-slate-100 mb-6">Que ressentez-vous globalement ?</h2>
                    <div className="grid grid-cols-1 gap-3">
                      {Object.values(EMOTIONS_DATA).map(family => (
                        <Card key={family.id} onClick={() => handleNext('familyId', family.id)} className="flex items-center gap-4 p-4">
                          <div className={`p-3 rounded-xl ${family.bg} ${family.color}`}><family.icon size={24} /></div>
                          <div><h3 className="text-slate-200 font-bold text-sm">{family.label}</h3><p className="text-slate-500 text-xs mt-0.5">{family.desc}</p></div>
                        </Card>
                      ))}
                    </div>
                  </>
                )}
                {step === 2 && currentFamily && (
                  <>
                    <h2 className="text-xl font-bold text-slate-100 mb-6">Soyons plus précis.</h2>
                    <div className="flex flex-col gap-3">
                      {currentFamily.specifics.map((spec, idx) => (
                        <Button key={idx} variant="outline" onClick={() => handleNext('specific', spec)} className="py-4 justify-start text-left pl-6 text-sm">{spec}</Button>
                      ))}
                    </div>
                  </>
                )}
                {step === 3 && currentFamily && (
                  <>
                    <h2 className="text-xl font-bold text-slate-100 mb-6">Où se loge cette émotion ?</h2>
                    <div className="grid grid-cols-2 gap-3">
                      {SOMATIC_SENSATIONS.map((sens, idx) => (
                        <button key={idx} onClick={() => handleNext('somatic', sens)} className="bg-slate-800/50 border border-slate-700 p-4 rounded-xl text-xs font-medium text-slate-300 text-left hover:bg-slate-700/50">{sens}</button>
                      ))}
                    </div>
                  </>
                )}
                {step === 4 && currentFamily && (
                  <>
                    <h2 className="text-xl font-bold text-slate-100 mb-6">Quel est votre besoin profond ?</h2>
                    <div className="flex flex-col gap-3">
                      {currentFamily.needs.map((need, idx) => (
                        <Button key={idx} variant="outline" onClick={() => handleNext('need', need)} className="py-4 justify-between px-6 text-sm">
                          <span>Besoin de <strong className="text-indigo-400 ml-1">{need}</strong></span><ChevronRight size={16} className="text-slate-600" />
                        </Button>
                      ))}
                    </div>
                  </>
                )}
                {step === 5 && currentFamily && (
                  <div className="flex flex-col h-full">
                    <h2 className="text-xl font-bold text-slate-100 mb-4">La Dichotomie du Contrôle</h2>
                    <p className="text-slate-400 text-sm mb-4">Que pouvez-vous faire <span className="underline decoration-teal-500">vous-même</span> aujourd'hui pour nourrir ce besoin ?</p>
                    <textarea value={analysis.action} onChange={(e) => setAnalysis(prev => ({ ...prev, action: e.target.value }))} placeholder="Ex: Prendre soin de moi, écrire, accepter..." className="w-full flex-1 min-h-[120px] bg-slate-900 border border-slate-700 rounded-xl p-4 text-slate-200 text-sm focus:outline-none mb-6 resize-none" />
                    <Button onClick={() => analysis.action.trim() && onComplete(analysis)} disabled={!analysis.action.trim()} variant="success" className="py-4 mt-auto">Valider et terminer</Button>
                  </div>
                )}
              </div>
            </div>
          );
        };

        // --- MAIN APP ---
        const App = () => {
          const [journal, setJournal] = useLocalStorage('sos-detachement-v3', []);
          const [currentTab, setCurrentTab] = useState('home');
          const [activeFlow, setActiveFlow] = useState(null);

          const startSOSFlow = (crisisId) => setActiveFlow('emotion_analyzer');

          return (
            <div className="min-h-screen flex justify-center bg-black">
              <main className="w-full max-w-md bg-slate-950 relative flex flex-col h-[100dvh] overflow-hidden">
                <div className="flex-1 px-5 pt-6 pb-0 relative overflow-hidden">
                  {!activeFlow ? (
                    <>
                      {currentTab === 'home' && <DashboardView onStartSOS={startSOSFlow} onMoodCheck={(mood) => setJournal([{ id: Date.now(), type: 'mood', date: new Date().toISOString(), mood }, ...journal])} journal={journal} />}
                      {currentTab === 'library' && <LibraryView />}
                      {currentTab === 'journal' && <JournalView journal={journal} clearJournal={() => setJournal([])} />}
                    </>
                  ) : (
                    <EmotionAnalyzerFlow 
                      onComplete={(analysis) => { setJournal([{ id: Date.now(), type: 'emotion_analysis', date: new Date().toISOString(), analysis }, ...journal]); setActiveFlow(null); }} 
                      onCancel={() => setActiveFlow(null)} 
                    />
                  )}
                </div>

                {!activeFlow && (
                  <div className="absolute bottom-0 left-0 right-0 p-4 pb-6 bg-gradient-to-t from-slate-950 via-slate-950 to-transparent z-40">
                    <div className="flex justify-between items-center bg-slate-800/80 backdrop-blur-xl border border-slate-700/50 rounded-2xl p-2 shadow-2xl">
                      {[
                        { id: 'home', icon: Home, label: "Accueil" },
                        { id: 'library', icon: BookOpen, label: "Comprendre" },
                        { id: 'journal', icon: Calendar, label: "Espace" }
                      ].map(tab => (
                        <button key={tab.id} onClick={() => setCurrentTab(tab.id)} className={`flex flex-col items-center gap-1 p-2 flex-1 rounded-xl transition-all duration-300 ${currentTab === tab.id ? 'text-indigo-400 bg-indigo-500/10' : 'text-slate-500'}`}>
                          <tab.icon size={20} />
                          <span className="text-[9px] font-semibold uppercase tracking-wider">{tab.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </main>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Script d'enregistrement de la PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(registration => {
              console.log('PWA activée ! Service Worker enregistré avec succès.', registration.scope);
            })
            .catch(error => {
              console.error('Erreur lors de l\'enregistrement de la PWA:', error);
            });
        });
      }
    </script>
</body>
</html>
